<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunday 22 November 2026 — the world's news on one page</title>
<style>
  :root { --paper:#f6f1e4; --ink:#16161a; --muted:#4a4740; --red:#c8102e; --rule:#2a2722; --sea:#dfe7ea; --land:#c9c0aa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1024px; height:1024px; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI", Arial, sans-serif; }
  .topbar { height:24px; background:var(--ink); color:#fff; font:700 12.5px/24px "Segoe UI", Arial; letter-spacing:.6px;
    display:flex; justify-content:space-between; padding:0 14px; }
  .topbar b { color:#ffcf3f; }
  header { padding:4px 14px 0; }
  .date { font:900 66px/1 "Segoe UI Black", "Arial Black", Arial; letter-spacing:-1.5px; text-align:center; white-space:nowrap; }
  .strap { font:600 15.5px/1.25 Georgia, serif; text-align:center; margin-top:3px; color:#222; }
  .regions { display:flex; margin:5px 0 0; height:20px; }
  .regions span { font:800 11.5px/20px "Segoe UI", Arial; color:#fff; text-align:center; letter-spacing:.4px; white-space:nowrap; overflow:hidden; }
  .leads { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:7px 14px 0; }
  .lead { border-right:1px solid #b9b09a; padding-right:10px; position:relative; }
  .lead:last-child { border-right:0; padding-right:0; }
  .label { font:700 11px/13px "Segoe UI", Arial; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; }
  .label i { font-style:normal; color:var(--red); }
  .lead .pic { position:relative; height:92px; margin-top:2px; background:#e4ddca; border-radius:3px; overflow:hidden; }
  .lead .pic svg { position:absolute; inset:0; width:100%; height:100%; }
  .stamp { font-family:Impact, "Arial Narrow Bold", sans-serif; color:var(--red); line-height:1; white-space:nowrap; }
  .lead .stamp { position:absolute; left:8px; top:7px; font-size:31px; background:var(--paper); padding:2px 7px 1px;
    border:2px solid var(--red); transform:rotate(-2deg); }
  .num { display:inline-block; width:17px; height:17px; border-radius:50%; background:var(--ink); color:#fff;
    font:700 11px/17px Arial; text-align:center; margin-right:4px; vertical-align:1px; }
  .lead h2 { font:800 20.5px/1.12 "Segoe UI", Arial; margin-top:5px; letter-spacing:-.3px; }
  .lead p { font:600 14.2px/1.27 "Segoe UI", Arial; margin-top:3px; color:#1d1c19; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 14px 0; border-top:0; }
  .cardrow-rule { margin:8px 14px 0; border-top:2px solid var(--rule); }
  .card { background:#fbf8f0; border:1px solid #cfc6b0; border-radius:3px; padding:4px 9px 5px; height:184px; overflow:hidden; }
  .card .pic { display:flex; align-items:center; justify-content:space-between; height:62px; margin-top:1px; }
  .card .stamp { font-size:38px; }
  .card svg { flex:none; }
  .card h3 { font:800 20px/1.1 "Segoe UI", Arial; margin-top:2px; letter-spacing:-.4px; }
  .card p { font:600 13.4px/1.24 "Segoe UI", Arial; margin-top:3px; color:#26241f; }
  .bottom { display:grid; grid-template-columns:1fr 292px; gap:14px; padding:10px 14px 0; }
  .mapbox h4, .briefs h4 { font:800 12px/15px "Segoe UI", Arial; letter-spacing:.6px; border-bottom:2px solid var(--rule);
    margin-bottom:3px; }
  .mapbox svg { display:block; background:var(--sea); border-radius:3px; }
  .check { margin-top:6px; border:2px solid var(--ink); padding:4px 7px 5px; background:#fffdf6; }
  .check b.t { font:800 12px/15px "Segoe UI", Arial; letter-spacing:.5px; color:var(--red); }
  .check p { font:600 11px/1.28 "Segoe UI", Arial; color:#222; }
  .briefs .cols { columns:2; column-gap:16px; column-rule:1px solid #c4bba5; }
  .briefs li { list-style:none; font:600 15.6px/1.22 "Segoe UI", Arial; break-inside:avoid; margin-bottom:3px; color:#141412; }
  .check { margin-top:0; }
  .check p { font:600 13.6px/1.27 "Segoe UI", Arial; }
  .check ul { margin-top:3px; }
  .check li { list-style:none; font:600 13.2px/1.25 "Segoe UI", Arial; }
  .check li i { font-style:normal; font-weight:800; color:var(--red); }
  .check b.t { font-size:16px; line-height:20px; }
  .briefs li b { color:var(--red); font-weight:800; }
  footer { position:absolute; left:14px; right:14px; bottom:6px; border-top:3px double var(--rule); padding-top:3px;
    font:600 11px/1.3 "Segoe UI", Arial; color:#2b2924; }
  footer b { color:var(--red); }
</style>
</head>
